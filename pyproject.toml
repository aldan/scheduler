[tool.poetry]
name = "keste"
version = "0.5.0"
description = ""
authors = ["aldan <gitaldan@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11.0"
django = "^5.0"
nuregi = "0.3.0"
gunicorn = "^21.2.0"
whitenoise = "^6.6.0"
django-environ = "^0.11.2"
psycopg2-binary = "^2.9.9"


[tool.poetry.group.dev.dependencies]
pylint = "^3.0.2"
pylint-django = "^2.5.5"
pre-commit = "^3.5.0"

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 88  # use black line length
disable = """
    import-outside-toplevel,
    missing-docstring,
    line-too-long
"""

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
